<svg width="800" height="280" xmlns="http://www.w3.org/2000/svg">
<rect width="800" height="280" fill="#1e1e2e" rx="8"/>
<rect width="800" height="30" fill="#181825" rx="8"><animate attributeName="opacity" values="1;0.9;1" dur="4s" repeatCount="indefinite"/></rect>
<circle cx="20" cy="15" r="6" fill="#f38ba8"/><circle cx="40" cy="15" r="6" fill="#f9e2af"/><circle cx="60" cy="15" r="6" fill="#a6e3a1"/>
<text x="400" y="20" text-anchor="middle" fill="#cdd6f4" font-family="monospace" font-size="12">LogForge — Syslog Hub</text>
<text x="15" y="55" fill="#a6e3a1" font-family="monospace" font-size="13">$ tail /var/log/firewall.log</text>
<text x="15" y="90" fill="#89b4fa" font-family="monospace" font-size="13">21286 lines/min from 2 firewalls</text>
<text x="15" y="120" fill="#cdd6f4" font-family="monospace" font-size="13">7 GB/day total volume</text>
<text x="15" y="150" fill="#f9e2af" font-family="monospace" font-size="13">✅ Filter: firewall → firewall.log</text>
<text x="15" y="180" fill="#f9e2af" font-family="monospace" font-size="13">✅ Filter: network → devices.log</text>
<text x="15" y="220" fill="#a6e3a1" font-family="monospace" font-size="13">✓ Completed successfully</text>
<rect x="15" y="430" width="10" height="18" fill="#a6e3a1">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>