# Firewall syslog — MUST load before broad network filters (59 < 60)
module(load="imudp")
input(type="imudp" port="514")

# Each firewall may source from ANY of its interface IPs — list them all
:fromhost-ip, isequal, "10.0.0.254" /var/log/firewall.log
& stop
:fromhost-ip, isequal, "10.0.1.254" /var/log/firewall.log
& stop
